<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daouda Games</title>
  <!-- SDKs Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent: #6366f1;
      --accent-pink: #ec4899;
      --text: #ffffff;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 50px; }
    
    header { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(to right, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .admin-btn { background: #1e293b; color: white; border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    .container { max-width: 1000px; margin: auto; padding: 15px; }
    
    /* Recherche & Catégories */
    .search-box { width: 100%; padding: 12px 15px; background: var(--card-bg); border: 1px solid #1e293b; color: white; border-radius: 10px; margin-bottom: 15px; font-size: 1rem; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .cat-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid #1e293b; padding: 8px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 600; }
    .cat-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-pink)); color: white; border: none; }

    /* Grille de jeux */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .game-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; transition: transform 0.2s; }
    .game-card:hover { transform: translateY(-3px); }
    .game-img { width: 100%; height: 190px; object-fit: cover; display: block; }
