<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mes Jeux - Admin</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      color: #4a90e2;
      text-align: center;
    }
    #loginSection, #addGameSection {
      background: white;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 5px;
    }
    input, button {
      font-size: 1rem;
      padding: 8px;
      margin-top: 8px;
      display: block;
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;
    }
    #gamesList {
      list-style: none;
      padding: 0;
    }
    #gamesList li {
      background: white;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 5px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
      display: flex;
      gap: 15px;
      align-items: center;
    }
    #gamesList img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
    }
    .gameInfo {
      flex-grow: 1;
    }
    .gameInfo h3 {
      margin: 0 0 5px 0;
    }
    .gameInfo small {
      color: #666;
    }
    .downloadLink {
      background: #4a90e2;
      color: white;
      padding: 8px 12px;
      text-decoration: none;
      border-radius: 3px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Mes Jeux - Administration</h1>

  <section id="loginSection">
    <label for="password">Entrer le mot de passe admin :</label>
    <input type="password" id="password" autocomplete="off" />
    <button id="loginBtn">Se connecter</button>
    <p id="loginError" style="color: red; display: none;">Mot de passe incorrect.</p>
  </section>

  <section id="addGameSection" style="display:none;">
    <h2>Ajouter un jeu</h2>
    <label for="gameTitle">Titre du jeu :</label>
    <input type="text" id="gameTitle" placeholder="Titre" />
    <label for="gameImage">URL de l'image :</label>
    <input type="text" id="gameImage" placeholder="https://exemple.com/image.jpg" />
    <label for="gameDate">Date d'ajout :</label>
    <input type="date" id="gameDate" />
    <label for="gameLink">Lien de téléchargement :</label>
    <input type="text" id="gameLink" placeholder="https://exemple.com/jeu.zip" />
    <button id="addGameBtn">Ajouter le jeu</button>
  </section>

  <section>
    <h2>Liste des jeux</h2>
    <ul id="gamesList"></ul>
  </section>

  <script>
    const PASSWORD = "admin123";

    const loginSection = document.getElementById('loginSection');
    const addGameSection = document.getElementById('addGameSection');
    const loginBtn = document.getElementById('loginBtn');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('loginError');

    loginBtn.addEventListener('click', () => {
      if (passwordInput.value === PASSWORD) {
        loginSection.style.display = 'none';
        addGameSection.style.display = 'block';
        loginError.style.display = 'none';
      } else {
        loginError.style.display = 'block';
      }
      passwordInput.value = '';
    });

    const addGameBtn = document.getElementById('addGameBtn');
    const gamesList = document.getElementById('gamesList');

    addGameBtn.addEventListener('click', () => {
      const title = document.getElementById('gameTitle').value.trim();
      const image = document.getElementById('gameImage').value.trim();
      const date = document.getElementById('gameDate').value;
      const link = document.getElementById('gameLink').value.trim();

      if (!title || !image || !date || !link) {
        alert('Merci de remplir tous les champs.');
        return;
      }

      const li = document.createElement('li');
      const img = document.createElement('img');
      img.src = image;
      img.alt = title;

      const infoDiv = document.createElement('div');
      infoDiv.className = "gameInfo";

      const h3 = document.createElement('h3');
      h3.textContent = title;

      const small = document.createElement('small');
      small.textContent = `Ajouté le : ${date}`;

      infoDiv.appendChild(h3);
      infoDiv.appendChild(small);

      const a = document.createElement('a');
      a.href = link;
      a.textContent = "Télécharger";
      a.className = "downloadLink";
      a.target = "_blank";
      a.rel = "noopener";

      li.appendChild(img);
      li.appendChild(infoDiv);
      li.appendChild(a);

      gamesList.appendChild(li);

      // Réinitialiser le formulaire
      document.getElementById('gameTitle').value = '';
      document.getElementById('gameImage').value = '';
      document.getElementById('gameDate').value = '';
      document.getElementById('gameLink').value = '';
    });
  </script>
</body>
</html>
