<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daouda Games</title>
  <!-- SDKs Firebase pour synchronisation globale -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    :root { --bg: #0b0f19; --card: #151c2c; --accent: #6366f1; --text: #fff; --sub: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }
    header { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
    .admin-btn { background: #1e293b; color: white; border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .container { max-width: 1000px; margin: auto; padding: 15px; }
    .search { width: 100%; padding: 12px; background: var(--card); border: 1px solid #1e293b; color: white; border-radius: 8px; margin-bottom: 15px; outline: none; }
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .cat-btn { background: var(--card); color: var(--sub); border: 1px solid #1e293b; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .cat-btn.active { background: var(--accent); color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #1e293b; }
    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 10px; }
    .title { font-size: 0.95rem; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--sub); margin-bottom: 10px; }
    .badge { background: #1e1b4b; color: #818cf8; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .btn { display: block; text-align: center; background: var(--accent); color: white; text-decoration: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--accent); }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #1e293b; color: white; border-radius: 6px; }
    .modal-content button { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎮 Daouda Games</div>
    <button class="admin-btn" onclick="openAdmin()">+ Ajouter un Jeu</button>
  </header>

  <div class="container">
    <input type="text" class="search" id="search" placeholder="Rechercher un jeu..." onkeyup="render()">
    
    <div class="categories">
      <button class="cat-btn active" onclick="setCat('Tous', this)">Tous</button>
      <button class="cat-btn" onclick="setCat('Android', this)">Android</button>
      <button class="cat-btn" onclick="setCat('PSP', this)">PSP</button>
      <button class="cat-btn" onclick="setCat('3DS', this)">3DS</button>
      <button class="cat-btn" onclick="setCat('PS2', this)">PS2</button>
    </div>

    <div class="grid" id="grid">
      <p style="color:var(--sub); text-align:center; grid-column:1/-1; padding:20px;">Chargement des jeux en ligne...</p>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px; color:white;">Ajouter un Jeu</h3>
      <input type="text" id="t" placeholder="Nom du jeu">
      <select id="p">
        <option value="Android">Android</option>
        <option value="PSP">PSP</option>
        <option value="3DS">3DS</option>
        <option value="PS2">PS2</option>
      </select>
      <input type="text" id="s" placeholder="Taille (ex: 1.3 Go)">
      <input type="text" id="i" placeholder="Lien de l'image (URL photo)">
      <input type="text" id="l" placeholder="Lien MediaFire">
      <button onclick="saveGame()">🚀 Publier pour tout le monde</button>
      <button onclick="closeModal()" style="background:#475569; margin-top:8px;">Annuler</button>
    </div>
  </div>

  <script>
    // Connexion à la base de données globale Firebase
    const firebaseConfig = {
      databaseURL: "https://daouda-games-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let gamesList = [];
    let currentCat = 'Tous';

    // Écouter les changements en direct sur Internet
    db.ref('games').on('value', (snapshot) => {
      const data = snapshot.val();
      gamesList = [];
      if (data) {
        Object.keys(data).forEach(key => {
          gamesList.push({ id: key, ...data[key] });
        });
      }
      render();
    });

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const grid = document.getElementById('grid');
      
      const filtered = gamesList.filter(g => {
        const matchCat = (currentCat === 'Tous' || g.platform === currentCat);
        const matchSearch = g.title.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color:var(--sub); text-align:center; grid-column:1/-1; padding:20px;">Aucun jeu disponible.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(g => `
        <div class="card">
          <img src="${g.img || 'https://via.placeholder.com/160x180'}" alt="${g.title}">
          <div class="card-body">
            <div class="title">${g.title}</div>
            <div class="meta">
              <span class="badge">${g.platform}</span>
              <span>${g.size}</span>
            </div>
            <a href="${g.link}" target="_blank" class="btn">📥 Télécharger</a>
          </div>
        </div>
      `).join('');
    }

    function setCat(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function openAdmin() {
      const pwd = prompt("Mot de passe Administrateur :");
      if (pwd === "2026") {
        document.getElementById('modal').style.display = 'flex';
      } else if (pwd !== null) {
        alert("Mot de passe incorrect !");
      }
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function saveGame() {
      const title = document.getElementById('t').value;
      const platform = document.getElementById('p').value;
      const size = document.getElementById('s').value;
      const img = document.getElementById('i').value;
      const link = document.getElementById('l').value;

      if (!title || !link) return alert("Remplis au moins le titre et le lien MediaFire !");

      // Enregistrement sur le serveur en ligne (accessible par n'importe quel autre téléphone)
      db.ref('games').push({
        title: title,
        platform: platform,
        size: size,
        img: img,
        link: link,
        createdAt: Date.now()
      });

      closeModal();

      document.getElementById('t').value = '';
      document.getElementById('s').value = '';
      document.getElementById('i').value = '';
      document.getElementById('l').value = '';

      alert("✅ Jeu publié en ligne pour tout le monde !");
    }
  </script>
</body>
</html>
