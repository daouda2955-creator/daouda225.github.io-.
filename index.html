<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff5f5">
<title>Daouda Games 🎮</title>
<style>
:root {
  --bg: #f8f9fc;
  --panel: #ffffff;
  --text: #1a1a1a;
  --muted: #666666;
  --primary: #e63946;
  --primary-hover: #d90429;
  --border: #eaeaea;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 20px 16px;
  background: #ffffff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  font-size: 22px;
  font-weight: 900;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px 16px;
}

.search {
  width: 100%;
  padding: 14px 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #ffffff;
  color: var(--text);
  font-size: 15px;
  outline: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  margin-bottom: 16px;
}

h2 {
  font-size: 18px;
  margin: 24px 0 12px;
  font-weight: 800;
}

.addbox {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  margin-bottom: 24px;
}

.help {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 14px;
}

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}

.form-control {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #fafafa;
  font-size: 14px;
  outline: none;
}

.btn-red {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--primary);
  color: white;
  text-decoration: none;
  padding: 16px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 16px;
  border: 0;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 6px 20px rgba(230, 57, 70, 0.3);
  transition: background 0.2s, transform 0.1s;
}

.btn-red:hover { background: var(--primary-hover); }
.btn-red:active { transform: scale(0.98); }

.game-card-style {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}

.game-header {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 16px;
}

.game-icon {
  font-size: 40px;
  background: #f1f2f6;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
}

.game-title {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 4px;
}

.game-meta {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 12px;
}

.remove-btn {
  background: #ffe5e7;
  color: var(--primary);
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  margin-top: 10px;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 30px;
}

.empty {
  display: none;
  color: var(--muted);
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

<header>
  <div class="brand">🔥 Daouda Games</div>
</header>

<main>
  <input id="search" class="search" type="search" placeholder="🔎 Rechercher un jeu..." aria-label="Rechercher">

  <!-- FORMULAIRE POUR AJOUTER UN JEU MEDIAFIRE -->
  <div class="addbox">
    <h2>➕ Ajouter un jeu (Lien MediaFire)</h2>
    <p class="help">Entre le nom du jeu, sa taille (ex: 4.9GB) et colle ton lien de téléchargement MediaFire direct.</p>
    
    <form id="mediafireForm">
      <div class="form-group">
        <label for="gameName">Nom du jeu</label>
        <input id="gameName" class="form-control" type="text" placeholder="Ex: EFOOTBALL 2027 OFFLINE" required>
      </div>
      <div class="form-group">
        <label for="gameSize">Taille du fichier</label>
        <input id="gameSize" class="form-control" type="text" placeholder="Ex: 4.9GB ou 850MB" required>
      </div>
      <div class="form-group">
        <label for="gameUrl">Lien MediaFire</label>
        <input id="gameUrl" class="form-control" type="url" placeholder="https://www.mediafire.com/file/..." required>
      </div>
      <button class="btn-red" type="submit">🔒 Publier et obtenir les fichiers</button>
    </form>
  </div>

  <h2>🎮 Jeux disponibles</h2>
  <div id="gamesList"></div>
  <div id="empty" class="empty">Aucun jeu trouvé.</div>
</main>

<footer>Daouda Games · Hébergement et Partage MediaFire</footer>

<script>
const mediafireForm = document.getElementById('mediafireForm');
const gamesList = document.getElementById('gamesList');
const searchInput = document.getElementById('search');
const emptyDiv = document.getElementById('empty');

const STORAGE_KEY = 'daoudaMediafireGamesV1';
let games = [];

try {
  games = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  if (!Array.isArray(games)) games = [];
} catch(e) {
  games = [];
}

// Jeux par défaut si la liste est vide (style l'image)
if (games.length === 0) {
  games.push({
    name: 'EFOOTBALL 2027 OFFLINE',
    size: '4.9GB',
    url: 'https://www.mediafire.com'
  });
}

function saveGames() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
}

function renderGames() {
  gamesList.innerHTML = '';
  const query = searchInput.value.toLowerCase().trim();
  let count = 0;

  games.forEach((game, index) => {
    if (query && !game.name.toLowerCase().includes(query)) return;
    count++;

    const card = document.createElement('div');
    card.className = 'game-card-style';

    card.innerHTML = `
      <div class="game-header">
        <div class="game-icon">⚽</div>
        <div>
          <div class="game-title">${game.name}</div>
          <div class="game-meta">
            <span>⭐ 4.5 / 5</span>
            <span>📥 ${game.size}</span>
          </div>
        </div>
      </div>
      <a class="btn-red" href="${game.url}" target="_blank" rel="noopener noreferrer">
        🔒 Obtenir les fichiers (${game.size})
      </a>
      <button class="remove-btn" onclick="deleteGame(${index})">🗑️ Supprimer</button>
    `;

    gamesList.appendChild(card);
  });

  emptyDiv.style.display = count === 0 ? 'block' : 'none';
}

window.deleteGame = function(index) {
  if (confirm('Voulez-vous supprimer ce jeu ?')) {
    games.splice(index, 1);
    saveGames();
    renderGames();
  }
};
