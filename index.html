<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mes Jeux - Admin</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      margin: 0; padding: 20px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      color: #4a90e2;
      text-align: center;
    }
    #loginSection, #addGameSection {
      background: white;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    label {
      display: block;
      margin: 10px 0 5px 0;
    }
    input[type=text], input[type=password], input[type=url], input[type=date] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      margin-top: 15px;
      background-color: #4a90e2;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357ABD;
    }
    .game {
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      padding: 10px;
    }
    .game img {
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      margin-right: 15px;
      border: 1px solid #ddd;
    }
    .game-info {
      flex-grow: 1;
    }
    .game-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 5px;
      color: #333;
    }
    .game-date {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
    }
    .game-link a {
      color: #4a90e2;
      text-decoration: none;
      font-weight: bold;
    }
    .game-link a:hover {
      text-decoration: underline;
    }
    #logoutBtn {
      background: #e74c3c;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Mes Jeux</h1>

  <div id="loginSection">
    <h2>Connexion Admin</h2>
    <label for="passwordInput">Mot de passe :</label>
    <input type="password" id="passwordInput" placeholder="Entrez le mot de passe" />
    <button onclick="login()">Se connecter</button>
    <p id="loginError" style="color:red; display:none;">Mot de passe incorrect</p>
  </div>

  <div id="addGameSection" style="display:none;">
    <h2>Ajouter un jeu</h2>
    <label for="gameTitle">Titre du jeu :</label>
    <input type="text" id="gameTitle" placeholder="Nom du jeu" />
    <label for="gameImage">URL de l'image :</label>
    <input type="url" id="gameImage" placeholder="https://exemple.com/image.jpg" />
    <label for="gameDate">Date d'ajout :</label>
